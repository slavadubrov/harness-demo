<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
<title id="title">Acceptance belongs to the checked artifact</title>
<desc id="desc">An optional model or offline fixture supplies configuration data. A trusted runner captures an immutable snapshot, executes mandatory checks and records evidence. Acceptance requires matching artifact, task and grader hashes. A later edit requires a new check.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="500" rx="20" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, sans-serif">
<text x="40" y="48" font-size="14" font-weight="700" letter-spacing="2" fill="#0f766e">HARNESS EVALUATION LAB</text>
<text x="40" y="90" font-size="30" font-weight="700" fill="#0f172a">A pass belongs to particular bytes.</text>
<text x="40" y="122" font-size="17" fill="#475569">The agent proposes. The runner checks. An edit starts a new acceptance decision.</text>
<rect x="28" y="157" width="240" height="211" rx="14" fill="#fff" stroke="#cbd5e1"/>
<text x="48" y="188" font-size="12" font-weight="700" letter-spacing="1" fill="#64748b">CANDIDATE DATA</text>
<text x="48" y="229" font-size="22" font-weight="650" fill="#0f172a">Fixture or model</text>
<text x="48" y="261" font-size="16" fill="#475569">config.json + other files</text>
<text x="48" y="298" font-size="15" fill="#475569">No shell. No chosen checks.</text>
<text x="48" y="323" font-size="15" fill="#475569">Narration cannot grant a pass.</text>
<rect x="303" y="157" width="789" height="211" rx="14" fill="#f0fdfa" stroke="#99d6ce"/>
<text x="325" y="187" font-size="12" font-weight="700" letter-spacing="1" fill="#0f766e">TRUSTED RUNNER</text>
<g fill="#fff" stroke="#99d6ce"><rect x="325" y="207" width="211" height="133" rx="10"/><rect x="563" y="207" width="239" height="133" rx="10"/><rect x="829" y="207" width="241" height="133" rx="10"/></g>
<g fill="#0f172a" font-size="20" font-weight="650"><text x="343" y="241">01 Capture</text><text x="581" y="241">02 Execute</text><text x="847" y="241">03 Bind evidence</text></g>
<g fill="#475569" font-size="15"><text x="343" y="275">Frozen bytes + SHA-256</text><text x="343" y="303">Dirty files count too</text><text x="581" y="275">Schema + behavior cases</text><text x="581" y="303">Separate Python process</text><text x="847" y="275">Command, status, output</text><text x="847" y="303">Artifact + task + grader</text></g>
<g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M269 273H315"/><path d="M537 273H554"/><path d="M803 273H820"/></g>
<rect x="325" y="402" width="745" height="58" rx="10" fill="#0f172a"/>
<text x="348" y="437" fill="#fff" font-size="17">Accept only if the holdout check passed and every identity still matches.</text>
<path d="M949 341V393" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="421" font-size="15" fill="#9f1239" font-weight="650">Later edit?</text><text x="40" y="446" font-size="15" fill="#475569">Old evidence is stale.</text>
</g></svg>
