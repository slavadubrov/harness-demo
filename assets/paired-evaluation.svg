<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc">
<title id="title">Change feedback, keep the comparison fixed</title>
<desc id="desc">Each arm receives two model calls and the same mandatory grader. The control gets a generic review instruction. The treatment gets public check feedback. Final artifacts are scored on held-out cases that are never sent to the model. Provider failure stops dispatch.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="550" rx="20" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, sans-serif">
<text x="40" y="48" font-size="14" font-weight="700" letter-spacing="2" fill="#4338ca">ONE CONTROLLED CHANGE</text>
<text x="40" y="90" font-size="30" font-weight="700" fill="#0f172a">Does check feedback help?</text>
<text x="40" y="122" font-size="17" fill="#475569">Same task, model settings, two-call budget and final scoring rule in both arms.</text>
<rect x="30" y="161" width="1060" height="131" rx="14" fill="#fff" stroke="#cbd5e1"/>
<rect x="30" y="314" width="1060" height="131" rx="14" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="49" y="197" font-size="17" font-weight="700" fill="#0f172a">CONTROL</text><text x="49" y="226" font-size="15" fill="#475569">blind-retry</text>
<text x="49" y="350" font-size="17" font-weight="700" fill="#4338ca">TREATMENT</text><text x="49" y="379" font-size="15" fill="#475569">check-feedback</text>
<g fill="#fff" stroke="#cbd5e1"><rect x="214" y="181" width="190" height="90" rx="9"/><rect x="461" y="181" width="242" height="90" rx="9"/><rect x="760" y="181" width="301" height="90" rx="9"/><rect x="214" y="334" width="190" height="90" rx="9"/><rect x="461" y="334" width="242" height="90" rx="9"/><rect x="760" y="334" width="301" height="90" rx="9"/></g>
<g fill="#0f172a" font-size="18" font-weight="650"><text x="232" y="214">Attempt 1</text><text x="479" y="214">Generic review</text><text x="778" y="214">Attempt 2 → final grade</text><text x="232" y="367">Attempt 1</text><text x="479" y="367">Public check feedback</text><text x="778" y="367">Attempt 2 → final grade</text></g>
<g fill="#475569" font-size="15"><text x="232" y="245">Run public check</text><text x="479" y="245">Check result withheld</text><text x="778" y="245">Holdout cases, no more repair</text><text x="232" y="398">Run public check</text><text x="479" y="398">Only experimental change</text><text x="778" y="398">Holdout cases, no more repair</text></g>
<g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M405 227H449"/><path d="M704 227H748"/><path d="M405 380H449"/><path d="M704 380H748"/></g>
<text x="40" y="492" font-size="17" font-weight="650" fill="#0f172a">Report every planned trial: success, bad artifact, runner error or provider stop.</text>
<text x="40" y="521" font-size="15" fill="#475569">Zero uplift is valid. Toy task results do not establish a general model or harness advantage.</text>
</g></svg>
