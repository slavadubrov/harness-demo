<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">Two stages in the harness ablation lab</title>
  <desc id="desc">A cumulative four-row feature matrix shows aggregate cost and pass rate but cannot attribute bundled changes. Five leave-one-component-out pairs then compare a control missing one component with the full-harness treatment. A validator requires exactly one changed field per pair.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1120" height="620" fill="#f8fafc"/>
  <rect x="28" y="24" width="1064" height="572" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="72" y="76" font-size="24" font-weight="700" fill="#0f172a">Separate the teaching matrix from causal attribution</text>
  <text x="72" y="106" font-size="14" fill="#64748b">The first view shows accumulation. The second view changes one component per comparison.</text>

  <rect x="72" y="146" width="420" height="338" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="98" y="180" font-size="15" font-weight="700" fill="#334155">1. CUMULATIVE FEATURE MATRIX</text>
  <text x="98" y="206" font-size="13" fill="#64748b">Shows aggregate pass rate and simulated cost</text>
  <rect x="98" y="238" width="368" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="118" y="265" font-size="13" font-weight="600" fill="#334155">bare-loop</text>
  <text x="438" y="265" text-anchor="end" font-size="13" fill="#64748b">1 / 12</text>
  <rect x="98" y="294" width="368" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="118" y="321" font-size="13" font-weight="600" fill="#1d4ed8">retry-only</text>
  <text x="438" y="321" text-anchor="end" font-size="13" fill="#334155">2 / 12</text>
  <rect x="98" y="350" width="368" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="118" y="377" font-size="13" font-weight="600" fill="#1d4ed8">handoff-and-retry</text>
  <text x="438" y="377" text-anchor="end" font-size="13" fill="#334155">5 / 12</text>
  <rect x="98" y="406" width="368" height="44" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="118" y="433" font-size="13" font-weight="600" fill="#5b21b6">full-harness</text>
  <text x="438" y="433" text-anchor="end" font-size="13" fill="#334155">12 / 12</text>
  <text x="98" y="470" font-size="12" fill="#9a3412">Final transition adds three components, so no attribution.</text>

  <line x1="512" y1="315" x2="564" y2="315" stroke="#2563eb" stroke-width="2"/>
  <polygon points="564,309 574,315 564,321" fill="#2563eb"/>

  <rect x="594" y="146" width="454" height="338" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="180" font-size="15" font-weight="700" fill="#1d4ed8">2. LEAVE-ONE-COMPONENT-OUT PAIRS</text>
  <text x="620" y="206" font-size="13" fill="#64748b">Each control differs from full-harness by one field</text>
  <text x="620" y="244" font-size="12" font-weight="600" fill="#334155">CONTROL OMITS</text>
  <text x="876" y="244" font-size="12" font-weight="600" fill="#334155">TREATMENT</text>
  <text x="1008" y="244" text-anchor="end" font-size="12" font-weight="600" fill="#334155">LIFT</text>
  <line x1="620" y1="254" x2="1022" y2="254" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="620" y="282" font-size="13" fill="#334155">retry policy</text>
  <text x="876" y="282" font-size="13" fill="#334155">full-harness</text>
  <text x="1008" y="282" text-anchor="end" font-size="13" font-weight="700" fill="#166534">+4</text>
  <text x="620" y="322" font-size="13" fill="#334155">progress handoff</text>
  <text x="876" y="322" font-size="13" fill="#334155">full-harness</text>
  <text x="1008" y="322" text-anchor="end" font-size="13" font-weight="700" fill="#166534">+5</text>
  <text x="620" y="362" font-size="13" fill="#334155">evaluator</text>
  <text x="876" y="362" font-size="13" fill="#334155">full-harness</text>
  <text x="1008" y="362" text-anchor="end" font-size="13" font-weight="700" fill="#166534">+4</text>
  <text x="620" y="402" font-size="13" fill="#334155">fail-closed acceptance</text>
  <text x="876" y="402" font-size="13" fill="#334155">full-harness</text>
  <text x="1008" y="402" text-anchor="end" font-size="13" font-weight="700" fill="#166534">+5</text>
  <text x="620" y="442" font-size="13" fill="#334155">context reset</text>
  <text x="876" y="442" font-size="13" fill="#334155">full-harness</text>
  <text x="1008" y="442" text-anchor="end" font-size="13" font-weight="700" fill="#166534">+2</text>

  <rect x="260" y="524" width="600" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="560" y="551" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Validator: every causal pair must change exactly one declared component</text>
</svg>
